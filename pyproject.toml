[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrohub"
version = "0.1.0"
authors = [
    { name = "Piotr Bruździak", email = "piotr.bruzdziak@pg.edu.pl" }
]
description = "Zintegrowana platforma analizy i obróbki widm FTIR oraz obliczeń kwantowo-chemicznych"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "PySide6>=6.6.0",
    "matplotlib>=3.8.0",
    "pyvista>=0.43.0",
    "pyvistaqt>=0.11.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
    "lmfit>=1.2.0",
    "openpyxl>=3.1.2",
    "h5py>=3.10.0",
    "psutil>=5.9.0"
]

[project.scripts]
spectrohub = "spectrohub.main:main"

[tool.setuptools.packages.find]
where = ["src"]